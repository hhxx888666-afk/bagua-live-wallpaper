name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply build patch
        shell: pwsh
        run: .\build-patch.ps1

      - name: Publish self-contained single EXE
        run: dotnet publish .\BaguaLiveWallpaper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\publish

      - name: Prepare desktop-only package
        shell: pwsh
        run: |
          Copy-Item .\README.md .\publish\README.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build one-click desktop installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .\installer.iss

      - name: Package desktop-only portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\BaguaLiveWallpaper-win-x64.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BaguaLiveWallpaper-Desktop-Setup
          path: .\Output\BaguaLiveWallpaper-Setup.exe
          if-no-files-found: error

      - name: Upload portable desktop package
        uses: actions/upload-artifact@v4
        with:
          name: BaguaLiveWallpaper-Desktop-win-x64
          path: .\BaguaLiveWallpaper-win-x64.zip
          if-no-files-found: error
