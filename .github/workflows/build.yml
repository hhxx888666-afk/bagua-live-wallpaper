name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Enable screensaver mode for build
        shell: pwsh
        run: |
          $p = '.\Program.cs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('private static void Main()', 'private static void Main(string[] args)')
          $oldMutex = 'using var mutex = new Mutex(true, "BaguaLiveWallpaper.SingleInstance", out bool first);'
          $newMutex = 'bool screenSaver = Array.Exists(args, a => string.Equals(a, "/s", StringComparison.OrdinalIgnoreCase));' + [Environment]::NewLine + '        using var mutex = new Mutex(true, screenSaver ? "BaguaLiveWallpaper.ScreenSaver" : "BaguaLiveWallpaper.SingleInstance", out bool first);'
          $s = $s.Replace($oldMutex, $newMutex)
          $s = $s.Replace('try { Application.Run(new Wallpaper()); }', 'try { Application.Run(new Wallpaper(screenSaver)); }')
          $oldCtor = '    public Wallpaper()' + [Environment]::NewLine + '    {'
          $newCtor = '    private readonly bool _screenSaver;' + [Environment]::NewLine + [Environment]::NewLine + '    public Wallpaper(bool screenSaver)' + [Environment]::NewLine + '    {' + [Environment]::NewLine + '        _screenSaver = screenSaver;'
          $s = $s.Replace($oldCtor, $newCtor)
          $oldTop = '        TopMost = false;'
          $newTop = '        TopMost = _screenSaver;' + [Environment]::NewLine + '        KeyPreview = _screenSaver;' + [Environment]::NewLine + '        if (_screenSaver)' + [Environment]::NewLine + '        {' + [Environment]::NewLine + '            Bounds = SystemInformation.VirtualScreen;' + [Environment]::NewLine + '            KeyDown += (_, _) => Close();' + [Environment]::NewLine + '            MouseClick += (_, _) => Close();' + [Environment]::NewLine + '        }'
          $s = $s.Replace($oldTop, $newTop)
          $oldShown = '        Shown += (_, _) => AttachToDesktop();'
          $newShown = '        Shown += (_, _) => { if (!_screenSaver) AttachToDesktop(); else { Activate(); Focus(); } };'
          $s = $s.Replace($oldShown, $newShown)
          Set-Content $p $s -Encoding UTF8

      - name: Publish self-contained single EXE
        run: dotnet publish .\BaguaLiveWallpaper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\publish

      - name: Prepare package
        shell: pwsh
        run: |
          Copy-Item .\README.md .\publish\README.txt
          Copy-Item .\publish\BaguaLiveWallpaper.exe .\publish\BaguaLiveWallpaper.scr

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build one-click installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .\installer.iss

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\BaguaLiveWallpaper-win-x64.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BaguaLiveWallpaper-Setup
          path: .\Output\BaguaLiveWallpaper-Setup.exe
          if-no-files-found: error

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: BaguaLiveWallpaper-win-x64
          path: .\BaguaLiveWallpaper-win-x64.zip
          if-no-files-found: error
